# The repo's branch-protection ruleset requires a status check named exactly
# `ci`. The job below is named `ci` — both the job name and its `name:` key — so
# the check this workflow reports is the one the ruleset gates on.
#
# `ci` is the ONLY check that gates a merge, and it deliberately touches no
# secret: every step either really runs or the job fails.
#
# The live testnet suite is deliberately NOT here. It is:
#   (a) required locally before any PR that touches the enforcement path, with
#       fresh evidence committed and checked by the `enforcement-path evidence
#       gate` step below (a file-list check — no network, no secret); and
#   (b) run automatically by `.github/workflows/live-suite.yml` on a weekly
#       schedule, to catch host/testnet drift.
#
# A green `ci` means the required checks ran. It does not mean the live suite ran
# against this change — the evidence file it points at is the record for that.
#
# Job-shape and cache audit (issue #101):
#   - `actions/setup-node` with `cache: npm` was already enabled in every
#     workflow (default package-lock.json dependency path), so nothing was added.
#   - This workflow is a single install -> check job: no duplicated `npm ci`
#     across jobs and no matrix fan-out exists to dedupe. Combining
#     typecheck+lint+test into one script was evaluated and rejected: the steps
#     are already serial in one warm environment and together cost a few
#     seconds, so a combined run saves nothing and obscures which gate failed.
#   - `typecheck` and `build` are deliberately NOT merged: tsconfig.json
#     typechecks the whole tree (src, scripts, tests, examples, benches) with
#     noEmit, while tsconfig.build.json emits dist/ from src only. Different
#     inputs, and the smoke/export steps below consume dist/.
#   - The one provable win: the decode-path benchmarks were the longest step
#     after the unit tests (median ~15s of a ~53s job across recent runs) while
#     being informational-only. They import src/ through tsx, need no dist/, and
#     assert no threshold, so they now run in the parallel, non-gating `bench`
#     job below (same npm cache, one extra cache-backed `npm ci`) instead of on
#     the required check's critical path. Measured before/after durations are
#     cited in the PR for this change.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI inspects the repo and runs tests; it never writes to it.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the evidence gate can diff the PR against its base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm test

      - name: build
        run: npm run build

      - name: smoke test export resolution
        run: npm run test:smoke

      # Pack the tarball, install it into a temp consumer, and import the root
      # and every declared subpath through a real resolver — and prove that a
      # path *not* in the export map is refused. The smoke step above imports
      # dist/ in-place; this one exercises the published artifact.
      - name: export-map resolution (pack + install + import)
        run: npm run test:exports

      # Structural validation of the evidence record (issue #65): asserts the
      # document's expected sections and row minimums, and fails loudly when its
      # shape drifts. This is what stops the file-list gate below going vacuously
      # green on a document nothing can parse. No network, no secret.
      - name: evidence structure check
        run: node scripts/check-enforcement-evidence.ts --check-structure

      # A PR that changes the enforcement path must ship fresh live-testnet
      # evidence in the same PR. This checks the file list only: no network, no
      # secret, so it cannot go green on a missing credential.
      - name: enforcement-path evidence gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/check-enforcement-evidence.ts "origin/$BASE_REF" HEAD

  # Informational decode-path benchmarks, moved out of the required `ci` job
  # (issue #101). They measure the pure-CPU work around the RPC round trip,
  # assert no wall-time threshold (shared runners are too noisy for one to mean
  # anything), and read only src/ through tsx — so they need no dist/ and gate
  # nothing: `continue-on-error` keeps them exactly as informational as before.
  # The committed baseline lives in docs/benchmarks.md; compare changes on a
  # developer machine, not here.
  bench:
    name: decode-path benchmarks (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: decode-path benchmarks (informational)
        run: npm run bench
        continue-on-error: true
